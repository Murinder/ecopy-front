name: Self-hosted runner smoke check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on local Windows runner
    runs-on: [self-hosted, Windows, X64, ecopy-front, node24]
    timeout-minutes: 15

    steps:
      - name: Show runner capabilities
        shell: powershell
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Show Node.js tools
        shell: powershell
        run: |
          node --version
          npm --version

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Build application
        shell: powershell
        run: npm run build
